_format_version: "2.1"
_transform: true

# SỬA Ở ĐÂY: Dùng "services" thay vì "_services"
services:
  - name: auth-service
    url: "http://auth-service:8080"
    routes:
      - name: auth-route
        paths: ["/auth"]
        strip_path: false
      - name: admin-route
        paths: ["/admin"]
        strip_path: false

  - name: core-service
    url: "http://core-service:3000"
    routes:
      - name: api-route
        paths: ["/api"]
        strip_path: true
      - name: insights-route
        paths: ["/v1/insights"]
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify: ["exp"]

  # Internal route for microservice-to-microservice communication (no JWT)
  - name: core-service-internal
    url: "http://core-service:3000"
    routes:
      - name: internal-insights-route
        paths: ["/internal"]
        strip_path: true  # Removes /internal prefix, forwards rest to core-service

  - name: stream-service
    url: "http://haproxy:8005"
    routes:
      - name: socketio-route
        paths: ["/socket.io"]
        strip_path: false
      - name: stream-api-route
        paths: ["/stream-api"]
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: ["exp"]
          uri_param_names: ["token"]

  - name: investment-service
    url: "http://investment-service:8001"
    routes:
      - name: investment-route
        paths: ["/invest-api"]
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: ["exp"]
          uri_param_names: ["token"]

  - name: investment-service-analyze
    url: "http://investment-service:8001/v1/investments/analyze"
    connect_timeout: 1200000
    write_timeout: 1200000
    read_timeout: 1200000
    routes:
      - name: investment-analyze-route
        paths: ["/invest-api/v1/investments/analyze"]
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: ["exp"]
          uri_param_names: ["token"]

  - name: notification-service
    url: "http://notification-service:3000"
    routes:
      - name: notification-api-route
        paths: ["/notification-api"]
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: ["exp"]
          uri_param_names: ["token"]

  - name: payment-service
    url: "http://payment-service:3000"
    routes:
      - name: payment-api-route
        paths: ["/payment-api"]
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: ["exp"]

  - name: payment-service-public
    url: "http://payment-service:3000"
    routes:
      - name: payment-webhook-route
        paths: ["/payment-webhook"]
        strip_path: true

  - name: backtest-service
    url: "http://backtest-service:8005"
    routes:
      - name: backtest-api-route
        paths: ["/backtest-api"]
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify: ["exp"]

  - name: ai-service
    url: "http://ai-service:8002"
    routes:
      - name: ai-signal-route
        paths: ["/v2/signal"]
        strip_path: false
      - name: ai-health-route
        paths: ["/health"]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "OPTIONS"]
          headers: ["*"]
          credentials: true

consumers:
  - username: shared-auth-consumer
    jwt_secrets:
      - algorithm: RS256
        key: "my-app-auth"
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1W4HxmDaLrRtv2RNYFaQ
          f9/th0sm4BOPLf08FFy6IfNANlV81519VvKOYvIfn998kWRR/M/Gm/veNiP909fM
          E+RazuVy08xq0e6ndlFNWlQZpppEFl0lbWAt2cqUjlmYqhTBXAahvErLcxN1sI0t
          3MWgptdcFF9Zin2mMaQiCa3N7kAO+nJA1KFVi9vGxzt5CeNbMXS1v8Ie3N72LY0Y
          udM/wRM85AJHlt2Gfoyc/uWkcu3xGVSu3wkfhjVapyNhOJk6KFj33ewrc93bcOv/
          khSpKfAEMP2eYW3hv27H/cV+ecQmAXHzxc6umdH65T2i/uXuCOMVp7Xc6fV6uoqe
          wwIDAQAB
          -----END PUBLIC KEY-----

# SỬA Ở ĐÂY: Dùng "plugins" thay vì "_plugins"
plugins:
  - name: cors
    config:
      origins: ["http://localhost:5173"]
      methods: ["GET","POST","PUT","PATCH","DELETE","OPTIONS"]
      headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "Authorization"]
      exposed_headers: ["X-Auth-Token"]
      credentials: true
      max_age: 3600
